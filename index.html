
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth — Авторизація</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="brand">
            <div class="brand-icon">S</div>
            <h1>SecureAuth</h1>
            <p>Захищена система авторизації</p>
        </div>

        <div class="tabs">
            <button class="tab active" id="loginTab">
                Вхід
            </button>
            <button class="tab" id="registerTab">
                Реєстрація
            </button>
        </div>

        <form id="loginForm">

            <h2>Вітаємо знову!</h2>
            <p class="subtitle">
                Увійдіть до свого облікового запису
            </p>

            <label for="loginEmail">Електронна пошта</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="example@gmail.com"
                required
            >

            <label for="loginPassword">Пароль</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Ваш пароль"
                required
            >

            <button type="submit" class="main-button">
                Увійти
            </button>

            <button type="button" id="adminLoginButton"
                    class="admin-button">
                Вхід адміністратора
            </button>

        </form>

        <form id="registerForm" class="hidden">

            <h2>Створення акаунта</h2>
            <p class="subtitle">
                Заповніть інформацію для реєстрації
            </p>

            <label for="regName">Ім'я</label>
            <input
                type="text"
                id="regName"
                placeholder="Ваше ім'я"
                required
            >

            <label for="regSurname">Прізвище</label>
            <input
                type="text"
                id="regSurname"
                placeholder="Ваше прізвище"
                required
            >

            <label for="regEmail">Електронна пошта</label>
            <input
                type="email"
                id="regEmail"
                placeholder="example@gmail.com"
                required
            >

            <label for="regPassword">Пароль</label>
            <input
                type="password"
                id="regPassword"
                placeholder="Мінімум 8 символів"
                required
            >

            <button type="submit" class="main-button">
                Зареєструватися
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="security-info">
            <span>🔒</span>
            Ваші дані захищені алгоритмом AES-GCM
        </div>

    </div>
</div>

</body>
</html>
